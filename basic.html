<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Calculator</title>
</head>
<body>
  <h1>Basic Calculator</h1>
  <input id="a" type="number" placeholder="Number A">
  <input id="b" type="number" placeholder="Number B">
  <br>
  <button onclick="run('add')">+</button>
  <button onclick="run('subtract')">-</button>
  <button onclick="run('multiply')">*</button>
  <button onclick="run('divide')">/</button>
  <p id="result"></p>

  <a href="index.html">Back to Home</a>

  <script src="Scripts/basic.js"></script>
  <script>
    function run(op) {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      try {
        const result = basic[op](a, b);
        document.getElementById('result').textContent = "Result: " + result;
      } catch (e) {
        document.getElementById('result').textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
